# ==============================================
# ProxiJob API Gateway - Nginx Reverse Proxy
# Domain: api.proxijob.io.vn
# ==============================================
# 
# Kiến trúc routing:
#   Mobile/Client → Nginx (443/HTTPS) → Docker containers (nội bộ)
#
# Các service backend chạy trên Docker ports:
#   - Identity API: localhost:5231 (REST, SignalR, Swagger)
#   - Job API:      localhost:5021 (REST, Swagger)
#   - Management:   localhost:5057 (REST, Swagger)
# ==============================================

# --- Upstream definitions ---
upstream identity_api {
    server 127.0.0.1:5231;
}

upstream job_api {
    server 127.0.0.1:5021;
}

upstream management_api {
    server 127.0.0.1:5057;
}

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name api.proxijob.io.vn;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Server ---
server {
    listen 443 ssl http2;
    server_name api.proxijob.io.vn;

    # SSL certificates (sẽ được Certbot tự động quản lý)
    ssl_certificate /etc/letsencrypt/live/api.proxijob.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.proxijob.io.vn/privkey.pem;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- General proxy settings ---
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;

    # --- Request size limit (for file uploads) ---
    client_max_body_size 20M;

    # ==========================================
    # IDENTITY SERVICE (port 5231)
    # Routes: /api/auth, /api/student, /api/plans,
    #         /api/payments, /api/business-profile,
    #         /api/messages, /api/admin, /api/public-cv
    # ==========================================
    location /api/auth {
        proxy_pass http://identity_api;
    }

    location /api/student {
        proxy_pass http://identity_api;
    }

    location /api/plans {
        proxy_pass http://identity_api;
    }

    location /api/payments {
        proxy_pass http://identity_api;
    }

    location /api/business-profile {
        proxy_pass http://identity_api;
    }

    location /api/messages {
        proxy_pass http://identity_api;
    }

    location /api/admin {
        proxy_pass http://identity_api;
    }

    # Job Service Admin endpoint (specific path takes precedence over /api/admin)
    location /api/admin/jobs {
        proxy_pass http://job_api;
    }


    location /api/public {
        proxy_pass http://identity_api;
    }

    # SignalR WebSocket (Chat Hub)
    location /hub/ {
        proxy_pass http://identity_api;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Identity Swagger UI
    location /identity/swagger {
        proxy_pass http://identity_api/swagger;
    }

    # ==========================================
    # JOB SERVICE (port 5021)
    # Routes: /api/job-posts, /api/shifts,
    #         /api/applications, /api/categories,
    #         /api/skills, /api/admin-jobs
    # ==========================================
    location /api/job-posts {
        proxy_pass http://job_api;
    }

    location /api/shifts {
        proxy_pass http://job_api;
    }

    location /api/applications {
        proxy_pass http://job_api;
    }

    location /api/categories {
        proxy_pass http://job_api;
    }

    location /api/skills {
        proxy_pass http://job_api;
    }

    location /api/admin-jobs {
        proxy_pass http://job_api;
    }

    # Job Swagger UI
    location /job/swagger {
        proxy_pass http://job_api/swagger;
    }

    # ==========================================
    # MANAGEMENT SERVICE (port 5057)
    # Routes: /api/employees, /api/timekeeping,
    #         /api/qr-code, /api/schedules,
    #         /api/payrolls
    # ==========================================
    location /api/employees {
        proxy_pass http://management_api;
    }

    location /api/timekeeping {
        proxy_pass http://management_api;
    }

    location /api/qr-code {
        proxy_pass http://management_api;
    }

    location /api/schedules {
        proxy_pass http://management_api;
    }

    location /api/payrolls {
        proxy_pass http://management_api;
    }

    # Management Swagger UI
    location /management/swagger {
        proxy_pass http://management_api/swagger;
    }

    # ==========================================
    # Static files (Identity service - payment QR images, etc.)
    # ==========================================
    location /images/ {
        proxy_pass http://identity_api;
    }

    # ==========================================
    # Default: Route to Identity (homepage → Swagger)
    # ==========================================
    location / {
        proxy_pass http://identity_api;
    }

    # ==========================================
    # Health check endpoint
    # ==========================================
    location /health {
        access_log off;
        return 200 'ProxiJob API Gateway is running';
        add_header Content-Type text/plain;
    }
}
