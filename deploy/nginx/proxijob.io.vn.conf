# ==============================================
# ProxiJob Admin Web Client - Nginx Configuration
# Domains: proxijob.io.vn, admin.proxijob.io.vn
# ==============================================

# --- HTTP → HTTPS redirect ---
server {
    listen 80;
    server_name proxijob.io.vn admin.proxijob.io.vn;

    # Certbot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS Server ---
server {
    listen 443 ssl http2;
    server_name proxijob.io.vn admin.proxijob.io.vn;

    # SSL certificates (sẽ được Certbot tự động quản lý)
    ssl_certificate /etc/letsencrypt/live/proxijob.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxijob.io.vn/privkey.pem;

    # Root directory pointing to the static build files
    root /var/www/proxijob-client;
    index index.html;

    # --- Security Headers ---
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Serve files directly, fallback to index.html for React SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets for performance
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
