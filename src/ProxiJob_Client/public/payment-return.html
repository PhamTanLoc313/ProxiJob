<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đang xử lý kết quả thanh toán...</title>
</head>
<body style="background:#F8FAFC; display:flex; align-items:center; justify-content:center; height:100vh; font-family:system-ui, -apple-system, sans-serif; margin:0;">
    <div style="text-align:center; background:white; padding:32px 24px; border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,0.06); max-width:320px; border:1px solid #E2E8F0;">
        <div style="width:48px; height:48px; border:4px solid #F97316; border-top-color:transparent; border-radius:50%; margin:0 auto 16px; animation:spin 0.8s linear infinite;"></div>
        <p style="color:#0F172A; font-size:16px; font-weight:800; margin:0 0 6px;">Đang chuyển hướng...</p>
        <p style="color:#64748B; font-size:12px; margin:0;">Vui lòng đợi trong giây lát.</p>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        (function() {
            var params = new URLSearchParams(window.location.search);
            var status = params.get("status") || "paid";
            var role = params.get("role") || "student";
            var orderCode = params.get("orderCode") || "";

            var targetPath = (role === "Business" || role === "employer") ? "/employer" : "/student";
            var destination = window.location.origin + targetPath + "?status=" + status + "&orderCode=" + orderCode;

            try {
                if (window.top && window.top !== window) {
                    window.top.location.href = destination;
                } else {
                    window.location.href = destination;
                }
            } catch (e) {
                window.location.href = destination;
            }
        })();
    </script>
</body>
</html>
